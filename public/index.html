<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SunPower Solar – Free Site Visit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fed7aa 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header .logo {
      font-size: 2rem;
    }

    .header h1 {
      font-size: 1.4rem;
      color: #92400e;
      font-weight: 700;
    }

    .header p {
      font-size: 0.85rem;
      color: #78350f;
      margin-top: 4px;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .agent-avatar {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .agent-info h2 { font-size: 1rem; font-weight: 700; }
    .agent-info p { font-size: 0.75rem; opacity: 0.85; }

    .online-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 380px;
      max-height: 420px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.bot {
      background: #f3f4f6;
      color: #111827;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.user {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.typing {
      background: #f3f4f6;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
    }

    .typing-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    .input-area {
      padding: 12px 14px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
    }

    .input-area textarea {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: none;
      height: 44px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
      overflow-y: hidden;
    }

    .input-area textarea:focus { border-color: #f59e0b; }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }

    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .send-btn svg { width: 20px; height: 20px; }

    .reset-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      margin-left: auto;
      font-size: 0.75rem;
      text-decoration: underline;
    }
    .reset-btn:hover { color: white; }

    .badge {
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 16px 12px;
    }

    .quick-reply-btn {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .quick-reply-btn:hover { background: #fde68a; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">☀️</div>
    <h1>SunPower Solar India</h1>
    <p>सरकारी सब्सिडी के साथ सोलर लगवाएं – मुफ्त साइट विज़िट बुक करें</p>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="agent-avatar">👨‍💼</div>
      <div class="agent-info">
        <h2>Ravi – Solar Advisor</h2>
        <p><span class="online-dot"></span>Online • Hindi / Telugu / Odia</p>
      </div>
      <span class="badge">Free</span>
      <button class="reset-btn" id="resetBtn" title="New conversation">↺ Reset</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="quick-replies" id="quickReplies">
      <button class="quick-reply-btn" data-msg="नमस्ते">नमस्ते 🙏</button>
      <button class="quick-reply-btn" data-msg="Hello">Hello</button>
      <button class="quick-reply-btn" data-msg="Solar के बारे में जानना है">Solar जानकारी</button>
      <button class="quick-reply-btn" data-msg="Free site visit chahiye">Free Visit चाहिए</button>
    </div>

    <div class="input-area">
      <textarea
        id="userInput"
        placeholder="यहाँ टाइप करें… (Hindi / English / Telugu / Odia)"
        rows="1"
      ></textarea>
      <button class="send-btn" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const resetBtn = document.getElementById('resetBtn');
    const quickRepliesEl = document.getElementById('quickReplies');

    let sessionId = null;

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'message typing';
      div.id = 'typingIndicator';
      div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    async function sendMessage(text) {
      const msg = text || userInput.value.trim();
      if (!msg) return;
      userInput.value = '';
      userInput.style.height = '44px';
      quickRepliesEl.style.display = 'none';

      appendMessage('user', msg);
      sendBtn.disabled = true;
      showTyping();

      try {
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message: msg }),
        });
        const data = await resp.json();
        hideTyping();
        if (data.error) {
          appendMessage('bot', '⚠️ ' + data.error);
        } else {
          sessionId = data.sessionId;
          appendMessage('bot', data.reply);
        }
      } catch (e) {
        hideTyping();
        appendMessage('bot', '⚠️ Connection error. Please try again.');
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    sendBtn.addEventListener('click', () => sendMessage());

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    userInput.addEventListener('input', () => {
      userInput.style.height = '44px';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    });

    document.querySelectorAll('.quick-reply-btn').forEach((btn) => {
      btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
    });

    resetBtn.addEventListener('click', async () => {
      if (!confirm('क्या आप नई बातचीत शुरू करना चाहते हैं?')) return;
      if (sessionId) {
        try { await fetch(`/chat/${sessionId}`, { method: 'DELETE' }); } catch {}
      }
      sessionId = null;
      messagesEl.innerHTML = '';
      quickRepliesEl.style.display = 'flex';
      appendMessage('bot', 'नमस्ते! मैं Ravi हूँ, SunPower Solar का advisor। आपका स्वागत है! 🙏☀️');
    });

    // Initial greeting on load
    (async () => {
      showTyping();
      await new Promise(r => setTimeout(r, 800));
      hideTyping();
      appendMessage('bot', 'नमस्ते! मैं Ravi हूँ, SunPower Solar का advisor। आपका नाम क्या है? 😊☀️');
    })();
  </script>
</body>
</html>
